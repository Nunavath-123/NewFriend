<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Birthday Surprise 💙</title>

    <style>
        body {
            margin: 0;
            height: 100vh;
            background: linear-gradient(135deg, #74ebd5, #9face6);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: "Segoe UI", Arial, sans-serif;
        }

        .card {
            background: white;
            padding: 40px 30px;
            border-radius: 20px;
            text-align: center;
            width: 320px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
            animation: pop 0.6s ease;
        }

        @keyframes pop {
            from {
                transform: scale(0.8);
                opacity: 0;
            }

            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
        }

        p {
            color: #666;
            margin-bottom: 30px;
            font-size: 18px;
        }

        .buttons {
            position: relative;
            height: 80px;
        }

        button {
            padding: 10px 22px;
            font-size: 16px;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            transition: 0.3s;
        }

        #yesBtn {
            background: #4CAF50;
            color: white;
            margin-right: 10px;
        }

        #yesBtn:hover {
            background: #43a047;
            transform: scale(1.1);
        }

        #noBtn {
            background: #f44336;
            color: white;
            position: absolute;
        }
    </style>
</head>

<body>

    <div class="card">

        <h1>Are you ok with the surprise? 🤝</h1>

        <p>There is something special waiting for you... 💙</p>

        <div class="buttons">

            <button id="yesBtn" onclick="yesClicked()">
                Yes 😊
            </button>

            <button id="noBtn" onmouseover="moveNo()">
                No 😒
            </button>

        </div>

    </div>

    <script>

        function yesClicked() {

            alert("Happy Birthday..! 😄🎉");

            document.querySelector(".card").innerHTML = `
                <h1>Yay! 🎉💙</h1>

                <p>
                    Happy Birthday..! 🎂🥳
                </p>

                <p>
                    I hope your special day is filled with
                    happiness, smiles and wonderful memories! ❤️
                </p>
            `;
        }


        function moveNo() {

            const noBtn = document.getElementById("noBtn");
            const card = document.querySelector(".card");

            const maxX = card.clientWidth - noBtn.offsetWidth;
            const maxY = card.clientHeight - noBtn.offsetHeight;

            const x = Math.random() * maxX;
            const y = Math.random() * maxY;

            noBtn.style.left = x + "px";
            noBtn.style.top = y + "px";
        }

    </script>

</body>

</html>
